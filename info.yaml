
# Tiny Tapeout project information
project:
  title: "Red Neuronal Fotocatalitica Multi-Sensor"
  author: "juannunez12-png"
  discord: ""
  description: "ASIC en Verilog para monitorear metales pesados, luz UV y pH, y controlar la purificacion del agua."
  language: "Verilog"
  clock_hz: 50000000

  # Espacio asignado al chip
  tiles: "1x1"

  # Nombre de nuestro modulo principal
  top_module: "tt_um_red_fotocatalitica"

  # Archivo Verilog dentro de src
  source_files:
    - "project.v"

# Descripcion de las terminales del chip
pinout:

  # Inputs - Sensores de entrada
  ui[0]: "Metal bit 0"
  ui[1]: "Metal bit 1"
  ui[2]: "Metal bit 2"
  ui[3]: "Metal bit 3"
  ui[4]: "UV bit 0"
  ui[5]: "UV bit 1"
  ui[6]: "pH bit 0"
  ui[7]: "pH bit 1"

  # Outputs - Control y alarma
  uo[0]: "Valvula abierta"
  uo[1]: "Alarma sin UV"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins - No utilizados
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
